<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photographer Management</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
        background: url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
        background-size: cover; display: flex; justify-content: center; align-items: center; height: 100vh;
    }
    .form-container {
        background: rgba(0, 0, 0, 0.6); /* Slightly darker for staff pages */
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        padding: 40px; border-radius: 15px; width: 100%; max-width: 450px;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        border: 1px solid rgba(255, 255, 255, 0.18); color: #fff;
        animation: slideUpFadeIn 1s ease-out forwards;
    }
    h2 { text-align: center; margin-bottom: 25px; font-weight: 600; text-shadow: 1px 1px 4px rgba(0,0,0,0.5); }
    label { font-size: 14px; font-weight: 300; margin-bottom: 5px; display: block; }
    input, select { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: none; background: rgba(255, 255, 255, 0.9); transition: all 0.3s ease; }
    button { width: 100%; padding: 12px; background-color: #d4af37; color: #111; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s ease; }
    button:hover { background-color: #f1c40f; transform: translateY(-2px); }
    .nav-links { text-align: center; margin-top: 15px; }
    .nav-links a { color: #d4af37; text-decoration: none; font-size: 14px; }
    .nav-links a:hover { text-decoration: underline; }
    @keyframes slideUpFadeIn { 0% { opacity: 0; transform: translateY(40px); } 100% { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

<div class="form-container">
  <h2>Add Photographer</h2>
  <form action="/add-photographer" method="POST">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required placeholder="e.g., Jane Smith">

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" required placeholder="jane@studio.com">

    <label for="phone">Phone Number</label>
    <input type="text" id="phone" name="phone" required placeholder="0771234567">

    <label for="specialization">Specialization</label>
    <select id="specialization" name="specialization">
      <option value="Wedding">Wedding Photography</option>
      <option value="Event">Corporate / General Events</option>
    </select>

    <button type="submit">Register Photographer</button>
  </form>

  <div class="nav-links">
    <a href="/index.html">← Back to Home</a>
  </div>
</div>

</body>
</html>
