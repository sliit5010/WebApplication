<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - Event Booking</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* 1. Reset & Background Image Setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Professional camera/event photography background from Unsplash */
            background: url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 2. Glassmorphism Form Container */
        .form-container {
            background: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 15px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
            animation: slideUpFadeIn 1s ease-out forwards;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
        }

        /* Form Inputs Styling */
        label {
            font-size: 14px;
            font-weight: 300;
            margin-bottom: 5px;
            display: block;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            color: #333;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transform: scale(1.02);
        }

        /* Submit Button Styling & Animation */
        button {
            width: 100%;
            padding: 12px;
            background-color: #d4af37; /* Premium gold */
            color: #111;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        button:hover {
            background-color: #f1c40f;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(241, 196, 15, 0.6);
        }

        /* Nav Links Styling */
        .nav-links {
            text-align: center;
            margin-top: 15px;
        }

        .nav-links a {
            color: #d4af37;
            text-decoration: none;
            font-size: 14px;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        /* Animation */
        @keyframes slideUpFadeIn {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Event Registration</h2>
    <form action="/register" method="POST">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" required placeholder="e.g., John Doe">

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="john@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">

        <label for="userType">Account Type</label>
        <select id="userType" name="userType">
            <option value="Regular">Regular Client</option>
            <option value="Premium">Premium Client</option>
        </select>

        <button type="submit">Create Account</button>
    </form>

    <div class="nav-links">
        <a href="index.html">← Back to Home</a>
    </div>
</div>

</body>
</html>
