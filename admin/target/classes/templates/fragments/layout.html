<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebra Admin - [[${title}]]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #f3c06b;
            --btn-gold: #eab308;
            --bg-dark: #080b11;
            --card-dark: #0f131f;
            --input-dark: #141a29;
            --border-dark: #1e2638;
            --text-gray: #9ca3af;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .sidebar {
            height: 100vh;
            background-color: var(--card-dark);
            border-right: 1px solid var(--border-dark);
            position: fixed;
            width: 250px;
            z-index: 100;
        }

        .main-content {
            margin-left: 250px;
            padding: 2.5rem;
            min-height: 100vh;
            background-color: var(--bg-dark);
        }

        /* Serif branding in Sidebar */
        .brand-logo-sidebar {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
            text-decoration: none;
        }

        .brand-logo-sidebar span {
            color: var(--btn-gold);
        }

        /* Navigation links */
        .nav-link {
            color: var(--text-gray);
            padding: 0.8rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            border-radius: 8px;
            margin: 0.15rem 0.75rem;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--btn-gold);
            background-color: var(--input-dark);
        }

        .nav-link.active {
            color: var(--primary-gold);
            background-color: var(--border-dark);
        }

        .nav-link.text-danger {
            color: #fca5a5 !important;
        }

        .nav-link.text-danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        /* Content elements global styling override */
        .card {
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 16px;
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .card-title {
            color: var(--primary-gold);
            font-family: 'Playfair Display', serif;
        }

        /* Tables override */
        .table {
            color: #ffffff !important;
            --bs-table-bg: transparent;
            --bs-table-border-color: var(--border-dark);
        }

        .table > :not(caption) > * > * {
            background-color: transparent !important;
            color: #ffffff !important;
            border-bottom-color: var(--border-dark) !important;
        }

        .table thead th {
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 1rem;
            color: var(--primary-gold) !important;
            padding: 1rem 0.75rem;
            border-bottom: 2px solid var(--border-dark) !important;
        }

        .table tbody td {
            padding: 1rem 0.75rem;
            vertical-align: middle;
            font-size: 0.95rem;
        }

        .table tbody tr:hover td {
            background-color: var(--input-dark) !important;
        }

        /* Buttons override */
        .btn-primary {
            background-color: var(--btn-gold);
            border-color: var(--btn-gold);
            color: #080b11;
            font-weight: 700;
            border-radius: 8px;
            padding: 0.6rem 1.5rem;
            transition: all 0.3s ease;
        }

        .btn-primary:hover, .btn-primary:focus {
            background-color: #f59e0b;
            border-color: #f59e0b;
            color: #080b11;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(234, 179, 8, 0.25);
        }

        .btn-outline-primary {
            color: var(--btn-gold);
            border-color: var(--btn-gold);
            font-weight: 600;
            border-radius: 8px;
        }

        .btn-outline-primary:hover {
            background-color: var(--btn-gold);
            color: #080b11;
            border-color: var(--btn-gold);
        }

        .btn-outline-danger {
            color: #fca5a5;
            border-color: #ef4444;
            font-weight: 600;
            border-radius: 8px;
        }

        .btn-outline-danger:hover {
            background-color: #ef4444;
            color: #ffffff;
            border-color: #ef4444;
        }

        /* Badges */
        .badge {
            font-weight: 600;
            font-size: 0.75rem;
            padding: 0.4em 0.8em;
            border-radius: 6px;
        }

        .badge.bg-primary {
            background-color: rgba(234, 179, 8, 0.1) !important;
            color: var(--btn-gold) !important;
            border: 1px solid rgba(234, 179, 8, 0.2);
        }

        .badge.bg-secondary {
            background-color: rgba(156, 163, 175, 0.1) !important;
            color: var(--text-gray) !important;
            border: 1px solid rgba(156, 163, 175, 0.2);
        }

        /* Forms in other pages */
        .form-label {
            color: var(--text-gray);
            font-weight: 500;
            font-size: 0.85rem;
        }

        .form-control, .form-select {
            background-color: var(--input-dark);
            border: 1px solid var(--border-dark);
            color: #ffffff;
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--input-dark);
            border-color: var(--btn-gold);
            color: #ffffff;
            box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.15);
        }

        .form-text {
            color: #6b7280;
        }

        hr {
            border-color: var(--border-dark);
            opacity: 1;
        }
    </style>
</head>
<body>
    <div th:fragment="sidebar">
        <div class="sidebar d-flex flex-column p-3">
            <div class="px-3 mb-4 mt-2">
                <a th:href="@{/dashboard}" class="brand-logo-sidebar">Celebra<span>.</span></a>
            </div>
            
            <nav class="nav flex-column">
                <a class="nav-link" th:href="@{/dashboard}" th:classappend="${currentPage == 'dashboard' ? 'active' : ''}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a class="nav-link" th:href="@{/photographers}" th:classappend="${currentPage == 'photographers' ? 'active' : ''}">
                    <i class="bi bi-camera"></i> Photographers
                </a>
                <a class="nav-link" th:href="@{/admins}" th:classappend="${currentPage == 'admins' ? 'active' : ''}" th:if="${session.user.role == 'SuperAdmin'}">
                    <i class="bi bi-people"></i> Admins
                </a>
                <a class="nav-link" th:href="@{/income}" th:classappend="${currentPage == 'income' ? 'active' : ''}" th:if="${session.user.role == 'SuperAdmin'}">
                    <i class="bi bi-currency-dollar"></i> Income
                </a>
                <hr>
                <a class="nav-link text-danger" th:href="@{/logout}">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </nav>
            
            <div class="mt-auto px-3 py-2" style="background-color: var(--input-dark); border-radius: 12px; border: 1px solid var(--border-dark);">
                <small class="text-muted d-block mb-1">Logged in as:</small>
                <div class="fw-bold text-white mb-1" th:text="${session.user.username}">User</div>
                <span class="badge bg-primary" th:text="${session.user.role}">Role</span>
            </div>
        </div>
    </div>
</body>
</html>
