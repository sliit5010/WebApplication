<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(title='Income Monitoring')}"></head>
<body th:with="currentPage='income'">
    <div th:replace="~{fragments/layout :: sidebar}"></div>

    <main class="main-content">
        <h2 class="fw-bold mb-4" style="font-family: 'Playfair Display', serif; color: var(--primary-gold); font-size: 2.2rem; letter-spacing: -0.01em;">Income Monitoring</h2>

        <div class="row g-4 mb-4">
            <div class="col-md-8">
                <div class="card p-4">
                    <h5 class="fw-bold mb-4">Monthly Income Breakdown</h5>
                    <canvas id="incomeChart" height="150"></canvas>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 h-100">
                    <h5 class="fw-bold mb-4">Income Summary</h5>
                    <div class="display-6 fw-bold text-primary mb-2" th:text="${'$' + #numbers.formatDecimal(totalIncome, 1, 'COMMA', 2, 'POINT')}"></div>
                    <p class="text-muted small">Total revenue generated from all modules (Bookings, Packages, Payments).</p>
                    <hr>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Avg. Monthly</span>
                        <span class="fw-bold">$2,340.00</span>
                    </div>
                    <div class="d-flex justify-content-between">
                        <span>Growth</span>
                        <span class="text-success fw-bold">+12.5%</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title mb-4 fw-bold">Detailed Payment Breakdown</h5>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Booking ID</th>
                                <th>Amount</th>
                                <th>Date</th>
                                <th>Payment Method</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="payment : ${recentPayments}">
                                <td th:text="${payment.bookingId}"></td>
                                <td class="fw-bold" th:text="${'$' + payment.amount}"></td>
                                <td th:text="${payment.paymentDate}"></td>
                                <td th:text="${payment.method}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:inline="javascript">
        const incomeData = /*[[${incomeByMonth}]]*/ {};
        const labels = Object.keys(incomeData);
        const values = Object.values(incomeData);

        const ctx = document.getElementById('incomeChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Monthly Income ($)',
                    data: values,
                    backgroundColor: '#eab308',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: {
                            color: '#9ca3af',
                            font: { family: 'Inter' }
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { color: '#1e2638' },
                        ticks: { color: '#9ca3af', font: { family: 'Inter' } }
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color: '#1e2638' },
                        ticks: { color: '#9ca3af', font: { family: 'Inter' } }
                    }
                }
            }
        });
    </script>
</body>
</html>
