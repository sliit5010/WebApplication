<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Celebra Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gold: #f3c06b;
            --btn-gold: #eab308;
            --bg-dark: #080b11;
            --card-dark: #0f131f;
            --input-dark: #141a29;
            --border-dark: #1e2638;
            --text-gray: #9ca3af;
        }

        body {
            background: radial-gradient(circle at center, #111625 0%, var(--bg-dark) 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            padding: 3rem 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            text-align: center;
            margin-bottom: 2rem;
            letter-spacing: -0.02em;
        }

        .brand-logo span {
            color: var(--btn-gold);
        }

        .form-label {
            color: var(--text-gray);
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .form-control {
            background-color: var(--input-dark);
            border: 1px solid var(--border-dark);
            color: #ffffff;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
        }

        .form-control::placeholder {
            color: #4b5563;
        }

        .form-control:focus {
            background-color: var(--input-dark);
            border-color: var(--btn-gold);
            color: #ffffff;
            box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.15);
        }

        .btn-gold-pill {
            background-color: var(--btn-gold);
            color: #080b11;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 50px;
            padding: 0.8rem 2rem;
            border: none;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 1rem;
        }

        .btn-gold-pill:hover {
            background-color: #f59e0b;
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(234, 179, 8, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="brand-logo">Celebra<span>.</span></h1>
        
        <div th:if="${error}" class="alert alert-danger py-2 mb-4 text-center" 
             style="background-color: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5; border-radius: 8px; font-size: 0.9rem;" 
             th:text="${error}"></div>
             
        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" placeholder="admin" required autocomplete="off">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-gold-pill">Login</button>
        </form>
        
        <p class="text-center mt-4 text-muted small" style="font-size: 0.8rem;">Only administrators can manage Celebra system settings.</p>
    </div>
</body>
</html>
