<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celebra. Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="site-container">
        <!-- Golden frame decoration from Celebra UI -->
        <div class="frame-decoration"></div>

        <nav class="navbar">
            <div class="logo">Celebra<span class="dot">.</span></div>
            <ul class="nav-links">
                <li><a href="#" class="active">Photographers</a></li>
            </ul>
        </nav>

        <main class="dashboard">
            <aside class="sidebar">
                <div class="glass-panel form-container">
                    <h2 id="form-title">Add Photographer</h2>
                    <form id="photographer-form">
                        <input type="hidden" id="edit-id" value="">
                        <div class="input-group">
                            <label for="id">Photographer ID</label>
                            <input type="text" id="id" required placeholder="e.g. P001">
                        </div>
                        <div class="input-group">
                            <label for="name">Full Name</label>
                            <input type="text" id="name" required placeholder="John Doe">
                        </div>
                        <div class="input-group">
                            <label for="contact">Contact Number</label>
                            <input type="text" id="contact" required placeholder="+1 234 567 890">
                        </div>
                        <div class="row">
                            <div class="input-group">
                                <label for="exp">Experience (Yrs)</label>
                                <input type="number" id="exp" required min="0" placeholder="5">
                            </div>
                            <div class="input-group">
                                <label for="price">Price/Hr ($)</label>
                                <input type="number" id="price" required min="0" step="0.01" placeholder="150">
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="type">Specialization</label>
                            <select id="type" required>
                                <option value="WEDDING">Wedding Photographer</option>
                                <option value="EVENT">Event Photographer</option>
                            </select>
                        </div>
                        <div class="input-group" id="dynamic-field-group">
                            <label id="dynamic-label" for="dynamic-input">Package Type</label>
                            <input type="text" id="dynamic-input" required placeholder="e.g. Platinum Package">
                        </div>
                        
                        <button type="submit" class="btn-primary" id="submit-btn">Save Photographer</button>
                        <button type="button" class="btn-secondary" id="cancel-btn" style="display: none;">Cancel</button>
                    </form>
                </div>
            </aside>

            <section class="content">
                <div class="glass-panel">
                    <div class="content-header">
                        <h2>Directory</h2>
                        <div class="stats">
                            <span class="stat-badge">Total: <b id="total-count">0</b></span>
                        </div>
                    </div>
                    
                    <div id="photographer-grid" class="grid-container">
                        <!-- Photographer cards will be injected here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
